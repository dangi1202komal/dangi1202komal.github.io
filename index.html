  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ax-width:600px;font-size:16px;line-height:1.65;color:#a8a296;text-wrap:pretty\">Senior Executive, Sales &amp; Marketing at Transworld Jets. 2.5 years across two charter companies selling a premium, high-ticket service to high-net-worth individuals, corporates and global brokers — from first enquiry to wheels-up and the follow-up call after landing.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:4px\">\n        <a href=\"#aviation\" style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 22px;background:#c9a86a;color:#0d1114;font-size:14px;font-weight:500;border-radius:999px\" style-hover=\"background:#f3eee5;color:#0d1114\">View the flight log →<\u002Fa>\n        <a href=\"#industries\" style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid rgba(243,238,229,.24);color:#f3eee5;font-size:14px;font-weight:500;border-radius:999px\" style-hover=\"border-color:#c9a86a;color:#c9a86a\">Where the skills travel<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showPortrait }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"flex:0 1 360px;min-width:240px;margin:0;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"aspect-ratio:4/5;width:100%;background:#151a1f;border:1px solid rgba(243,238,229,.08)\">\n          <image-slot src=\"35f1f91d-ed7c-4e40-b56e-70ea5292548d\" id=\"kd-portrait\" shape=\"rect\" placeholder=\"Portrait of Komal — drop a photo\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <figcaption style=\"display:flex;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a8a296\"><span>Transworld Jets<\u002Fspan><span>Aug 2025 — Present<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:clamp(56px,7vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid rgba(243,238,229,.14)\">\n    <div style=\"padding:28px 24px 32px 0;display:flex;flex-direction:column;gap:8px;border-right:1px solid rgba(243,238,229,.08)\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(44px,4.6vw,64px);line-height:1;color:#c9a86a\">$735K<\u002Fspan>\n      <span style=\"font-size:13px;color:#a8a296\">charter revenue · ≈ ₹7.5 cr<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px 32px;display:flex;flex-direction:column;gap:8px;border-right:1px solid rgba(243,238,229,.08)\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(44px,4.6vw,64px);line-height:1\">25+<\u002Fspan>\n      <span style=\"font-size:13px;color:#a8a296\">charters closed<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px 32px;display:flex;flex-direction:column;gap:8px;border-right:1px solid rgba(243,238,229,.08)\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(44px,4.6vw,64px);line-height:1\">90<\u002Fspan>\n      <span style=\"font-size:13px;color:#a8a296\">block hours sold<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px 32px;display:flex;flex-direction:column;gap:8px;border-right:1px solid rgba(243,238,229,.08)\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(44px,4.6vw,64px);line-height:1\">500+<\u002Fspan>\n      <span style=\"font-size:13px;color:#a8a296\">enquiries quoted<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:28px 0 32px 24px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(44px,4.6vw,64px);line-height:1\">1,300+<\u002Fspan>\n      <span style=\"font-size:13px;color:#a8a296\">brokers reached worldwide<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"aviation\" data-screen-label=\"01 Aviation\" style=\"scroll-margin-top:64px;padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);max-width:1440px;margin:0 auto\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,96px)\">\n    <div style=\"flex:1 1 300px;min-width:0;max-width:440px;display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c9a86a\">01 — Origin<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,5.4vw,76px);line-height:.95;letter-spacing:-.01em\">Home base:<br><span style=\"font-style:italic\">private aviation.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#a8a296;text-wrap:pretty\">Charter sales is the core mandate. Around it: client and broker relationships, the marketing that generates enquiries, the client database and monthly sales MIS, and guest coordination after booking. An Aviation Management graduate who has worked on both sides of the charter market — broker and operator.<\u002Fp>\n      <div style=\"margin-top:12px;padding:24px;border:1px solid rgba(201,168,106,.4);display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a296\">Largest single booking<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-size:48px;line-height:1;color:#c9a86a\">USD 62,128<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:2 1 520px;min-width:0;display:flex;flex-direction:column\">\n      <article style=\"padding:0 0 40px;border-bottom:1px solid rgba(243,238,229,.1);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;align-items:baseline\">\n          <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1\">Transworld Jets <span style=\"font-style:italic;color:#a8a296\">— operator<\u002Fspan><\u002Fh3>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#c9a86a\">AUG 2025 — PRESENT<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;font-weight:500;letter-spacing:.02em\">Senior Executive, Sales &amp; Marketing · Delhi NCR<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 32px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Charter sales<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Pitch, negotiate and close with direct clients and brokers — 25+ charters, 90 block hours and USD 735,000 since Nov 2025 on the Hawker 4000, Falcon 2000 and other types.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Marketing<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Built the long-term new-client acquisition plan. Email campaigns, empty legs and offers; daily availability posts across 8 broker groups; 40+ social posts.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Brand, web &amp; events<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Shaped the website redesign to luxury-charter standards with integrated booking and empty-leg platform. Designed brochures and the jet card membership plan; represented the company at 3 industry events.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Guest relations<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Client profiles, travel patterns and aircraft preferences. Repeat business through post-flight check-ins, occasion wishes and proactive trip planning.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Data &amp; reporting<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Owns flight records and the client/broker database; delivers monthly sales MIS/MIR; tracks competitor pricing and fleets.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"padding:40px 0;border-bottom:1px solid rgba(243,238,229,.1);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;align-items:baseline\">\n          <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1\">AirLuxxis <span style=\"font-style:italic;color:#a8a296\">— charter broker<\u002Fspan><\u002Fh3>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#c9a86a\">JUN 2024 — JUL 2025<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;font-weight:500;letter-spacing:.02em\">Sales Associate · Delhi NCR<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 32px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Charter ops &amp; BD<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Ran the end-to-end workflow on 4–5 daily RFQs — enquiry, quote, close — and coordinated execution with operators and FBOs. Onboarded 10+ high-value prospects; handled 30+ aircraft-sales enquiries.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c9a86a\">Marketing &amp; CRM<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Built and segmented a 15,000+ stakeholder database — owners, buyers, FBOs, charter clients. Shipped 10+ multi-channel campaigns a month.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"padding:40px 0 0;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;align-items:baseline\">\n          <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1\">Kainos Aviation <span style=\"font-style:italic;color:#a8a296\">— NSOP, Sikorsky S-76C++<\u002Fspan><\u002Fh3>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#c9a86a\">FEB — MAR 2023<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;font-weight:500;letter-spacing:.02em\">Aviation Management Intern · Gurugram<\u002Fspan>\n        <p style=\"margin:0;max-width:640px;font-size:15px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">Flight planning and monitoring with the Chief of Flight Safety — routes, clearances, FIR regulations, AVSEC and ops-manual compliance. The operational grounding behind every quote since.<\u002Fp>\n      <\u002Farticle>\n    < \">INTL<\u002Fspan>\n        <span style=\"padding:14px 22px;color:#c9a86a;border-bottom:1px solid rgba(243,238,229,.06)\">MLE<\u002Fspan><span style=\"padding:14px 0;border-bottom:1px solid rgba(243,238,229,.06)\">The Maldives<\u002Fspan><span style=\"padding:14px 22px;color:#a8a296;border-bottom:1px solid rgba(243,238,229,.06)\">INTL<\u002Fspan>\n        <span style=\"padding:14px 22px;color:#c9a86a\">IND<\u002Fspan><span style=\"padding:14px 0\">India network sectors<\u002Fspan><span style=\"padding:14px 22px;color:#a8a296\">DOM<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a296\">Types sold &amp; worked on<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column\">\n          <span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1.3;border-bottom:1px solid rgba(243,238,229,.08);padding:6px 0\">Hawker 4000<\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1.3;border-bottom:1px solid rgba(243,238,229,.08);padding:6px 0\">Dassault Falcon 2000<\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1.3;padding:6px 0\">Sikorsky S-76C++<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a296\">Aviation platforms<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">Avinode<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">Leon<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">Air Charter Guide<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">ForeFlight<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">SkyVector<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">FlightAware<\u002Fspan>\n          <span style=\"padding:7px 12px;border:1px solid rgba(243,238,229,.16);border-radius:999px;font-size:13px\">Flightradar24<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"craft\" data-screen-label=\"02 Craft\" style=\"scroll-margin-top:64px;background:#f3eee5;color:#16191c\">\n  <div style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      <div style=\"flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a6a2f\">02 — The craft beneath<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,5.4vw,76px);line-height:.95;letter-spacing:-.01em\">Not general skills.<br><span style=\"font-style:italic;color:#8a6a2f\">Specialist ones that travel.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"flex:1 1 340px;min-width:0;max-width:460px;margin:0;font-size:16px;line-height:1.65;color:#5f5a51;text-wrap:pretty\">Selling a private jet seat is selling time, privacy and certainty to people who expect all three. The disciplines it demands are the same ones every top-end market runs on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));border-top:1px solid rgba(22,25,28,.16)\">\n      <div style=\"padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(22,25,28,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a6a2f\">I.<\u002Fspan>\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1\">The Close<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3d3a35;text-wrap:pretty\">Consultative selling, pricing and negotiation on high-ticket, time-sensitive deals with HNI and UHNI clients.<\u002Fp>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f5a51\">→ $735K · 25+ closed · top deal $62,128<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(22,25,28,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a6a2f\">II.<\u002Fspan>\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1\">The Relationship<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3d3a35;text-wrap:pretty\">Concierge-style guest relations: remembering preferences, marking occasions, checking in after landing — so the next trip is booked with her.<\u002Fp>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f5a51\">→ repeat business &amp; referrals<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(22,25,28,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a6a2f\">III.<\u002Fspan>\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1\">The Network<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3d3a35;text-wrap:pretty\">Working fluently with intermediaries — brokers, operators, FBOs, owners — and keeping a global trade audience warm.<\u002Fp>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f5a51\">→ 1,300+ brokers · 15,000+ contacts<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(22,25,28,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a6a2f\">IV.<\u002Fspan>\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1\">The Brand<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3d3a35;text-wrap:pretty\">Luxury-standard web, brochures and a jet card membership plan; campaigns, social and event presence that generate demand.<\u002Fp>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f5a51\">→ 3 industry events · 10+ campaigns/month<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(22,25,28,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a6a2f\">V.<\u002Fspan>\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1\">The Intelligence<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3d3a35;text-wrap:pretty\">CRM discipline, monthly sales MIS/MIR, competitor pricing and fleet tracking — plus AI tools to automate in-house workflows.< ospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a8a296\">\n          <span>DEL → {{ current.code }}<\u002Fspan><span style=\"color:#c9a86a\">{{ current.group }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,4.6vw,64px);line-height:1\">{{ current.name }}<\u002Fh3>\n          <p style=\"margin:0;max-width:640px;font-size:17px;line-height:1.6;color:#cfc9bd;text-wrap:pretty\">{{ current.pitch }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(243,238,229,.12)\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:12px;padding:12px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a296;border-bottom:1px solid rgba(243,238,229,.12)\"><span>In aviation<\u002Fspan><span><\u002Fspan><span>Translates to<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ current.map }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid rgba(243,238,229,.08);font-size:15px;line-height:1.5\">\n              <span style=\"color:#cfc9bd\">{{ m.from }}<\u002Fspan><span style=\"color:#c9a86a\">→<\u002Fspan><span>{{ m.to }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a296\">Roles she fits<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ current.roles }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <span style=\"p erships, Travel Platforms', 'Sales Engineer (BizAv)'] }\n];\n\nclass Component extends DCLogic {\n  state = { sel: 'aviation' };\n  renderVals() {\n    const view = this.props.industryView ?? 'explorer';\n    const sel = this.state.sel;\n    const industries = INDUSTRIES.map((ind, i) => {\n      const on = ind.id === sel;\n      return { ...ind,\n        showGroup: i === 0 || INDUSTRIES[i - 1].group !== ind.group,\n        select: () => this.setState({ sel: ind.id }),\n        bg: on ? 'rgba(201,168,106,.12)' : 'transparent',\n        border: on ? '#c9a86a' : 'rgba(243,238,229,.1)',\n        color: on ? '#c9a86a' : '#f3eee5' };\n    });\n    return {\n      industries,\n      current: INDUSTRIES.find(x => x.id === sel),\n      isExplorer: view === 'explorer',\n      isGrid: view === 'grid',\n      showPortrait: this.props.showPortrait ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
